[project]
name = "pangancast"
version = "1.0.0"
description = "Forecasting harga pangan harian (cabai, bawang, beras) dari data PIHPS Bank Indonesia"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D1"]
ignore = ["D100", "D104", "D105", "D107", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"app/*" = ["D", "E402"]
"src/models/lstm.py" = ["N805"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tes yang memakai SARIMA/Prophet (lebih lambat)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["src/tune.py", "src/train.py", "src/report.py"]
